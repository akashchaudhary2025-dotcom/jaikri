<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contact — Jaikri</title><link rel="stylesheet" href="styles.css"></head><body><main id="main" class="page"><section class="container content-page"><p class="eyebrow">Contact</p><h1>We’re listening.</h1><p>For order support, product questions or a note from you, send us a message. We reply within two business days.</p><form class="form-section" id="contact-form"><div class="field-grid"><div class="field"><label for="name">Name *</label><input id="name" required></div><div class="field"><label for="contact-email">Email address *</label><input id="contact-email" type="email" required></div><div class="field full"><label for="message">How can we help? *</label><input id="message" required></div></div><button class="button" type="submit">Send message <span>→</span></button><p class="error" aria-live="polite"></p></form><h2>Customer care</h2><p>hello@jaikri.in<br>Monday–Friday, 10am–6pm IST</p></section></main><script src="script.js"></script><script>document.querySelector('#contact-form').addEventListener('submit',e=>{e.preventDefault();e.currentTarget.querySelector('.error').style.color='#32643b';e.currentTarget.querySelector('.error').textContent='Thank you. Your message has been received.';e.currentTarget.reset()})</script></body></html>
