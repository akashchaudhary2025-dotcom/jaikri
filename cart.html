<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Your bag — Jaikri</title><link rel="stylesheet" href="styles.css"></head><body><main id="main" class="page"><div class="container page-title"><p class="eyebrow">Your bag</p><h1>Saved for now.</h1></div><section class="container cart-layout"><div id="cart-lines"></div><aside class="order-summary"><h2>Order summary</h2><div id="summary-lines"></div><div class="summary-row"><span>Delivery</span><span>Calculated at checkout</span></div><div class="summary-row total"><span>Total</span><strong id="cart-total">₹0</strong></div><a class="button" href="checkout.html">Proceed to checkout <span>→</span></a><p class="summary-note">Secure checkout · Taxes included</p></aside></section></main><script src="script.js"></script><script>
function renderCart(){const cart=getCart(),lines=document.querySelector('#cart-lines'),summary=document.querySelector('#summary-lines');if(!cart.length){lines.innerHTML='<div class="empty"><h3>Your bag is waiting.</h3><p>Add a few Jaikri pieces to make it yours.</p><a class="button" href="shop.html">Explore the collection</a></div>';summary.innerHTML='';document.querySelector('#cart-total').textContent='₹0';return}let total=0;lines.innerHTML=cart.map(i=>{const p=products[i.id];total+=p.price*i.qty;return `<article class="cart-item"><img src="${p.image}" alt="${p.name}"><div><h2>${p.name}</h2><p>${p.size} · Natural</p><p>${money(p.price)}</p><div class="quantity"><button data-change="${i.id}" data-delta="-1" aria-label="Decrease quantity">−</button><span>${i.qty}</span><button data-change="${i.id}" data-delta="1" aria-label="Increase quantity">+</button></div><button class="remove" data-remove="${i.id}">Remove</button></div><strong class="price">${money(p.price*i.qty)}</strong></article>`}).join('');summary.innerHTML=cart.map(i=>`<div class="summary-row"><span>${products[i.id].name} × ${i.qty}</span><span>${money(products[i.id].price*i.qty)}</span></div>`).join('');document.querySelector('#cart-total').textContent=money(total)}renderCart();document.addEventListener('click',e=>{const c=e.target.closest('[data-change]'),r=e.target.closest('[data-remove]');if(c){let cart=getCart(),i=cart.find(x=>x.id===c.dataset.change);i.qty+=+c.dataset.delta;if(i.qty<1)cart=cart.filter(x=>x!==i);saveCart(cart);renderCart()}if(r){saveCart(getCart().filter(x=>x.id!==r.dataset.remove));renderCart()}});
</script></body></html>
