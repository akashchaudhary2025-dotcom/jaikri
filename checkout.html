<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout — Jaikri</title><link rel="stylesheet" href="styles.css"></head><body><main id="main" class="page"><section class="container checkout-layout"><form id="checkout-form"><a class="wordmark" href="index.html">JAIKRI</a><div class="steps"><span class="current">1. Information</span><span>2. Delivery</span><span>3. Payment</span></div><section class="form-section"><h2>Contact</h2><div class="field-grid"><div class="field full"><label for="check-email">Email address *</label><input id="check-email" type="email" autocomplete="email" required></div></div></section><section class="form-section"><h2>Delivery address</h2><div class="field-grid"><div class="field"><label for="first">First name *</label><input id="first" autocomplete="given-name" required></div><div class="field"><label for="last">Last name *</label><input id="last" autocomplete="family-name" required></div><div class="field full"><label for="address">Address *</label><input id="address" autocomplete="street-address" required></div><div class="field"><label for="city">City *</label><input id="city" autocomplete="address-level2" required></div><div class="field"><label for="pin">PIN code *</label><input id="pin" inputmode="numeric" autocomplete="postal-code" required></div><div class="field full"><label for="phone">Phone number *</label><input id="phone" type="tel" autocomplete="tel" required></div></div></section><section class="form-section"><h2>Payment</h2><label class="payment-option"><input type="radio" checked name="payment"> Card, UPI or net banking</label><label class="payment-option"><input type="radio" name="payment"> Cash on delivery</label></section><button class="button" type="submit">Review your order <span>→</span></button><p class="error" aria-live="polite"></p></form><aside class="order-summary"><h2>Your order</h2><div id="checkout-summary"></div><div class="summary-row total"><span>Total</span><strong id="checkout-total">₹0</strong></div><p class="summary-note">Delivery options are confirmed after your address.</p></aside></section></main><script src="script.js"></script><script>const c=getCart();let t=0;document.querySelector('#checkout-summary').innerHTML=c.map(i=>{t+=products[i.id].price*i.qty;return `<div class="summary-row"><span>${products[i.id].name} × ${i.qty}</span><span>${money(products[i.id].price*i.qty)}</span></div>`}).join('')||'<p class="summary-note">Your bag is empty.</p>';document.querySelector('#checkout-total').textContent=money(t);document.querySelector('#checkout-form').addEventListener('submit',e=>{e.preventDefault();if(!c.length){document.querySelector('.error').textContent='Your bag is empty. Add a piece before checking out.';return}document.querySelector('.error').textContent='This demo has captured your details locally. Connect a payment provider to complete orders.'})</script></body></html>
